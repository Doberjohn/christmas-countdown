    for (const sel of ['.snowcap', '.sill-snow']) {
      const el = document.querySelector(sel);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      ledges.push({ x: r.left, y: r.top + r.height * 0.3, w: r.width });
    }
  }

  function updateGust(now, dt) {
    if (reduce) { gust = 0; gustFrost = Math.max(0, gustFrost - dt / 7); return; }
    if (gustT0 < 0 && now >= nextGust) {
      gustT0 = now;
      gustDir = Math.random() < 0.7 ? 1 : -1;
      nextGust = now + rand(22000, 42000);
      measureLedges();
      gustSound();
    }
    if (gustT0 >= 0) {
      const s = (now - gustT0) / 1000;
      if (s < 1.2) gust = easeInOut(s / 1.2);
      else if (s < 2.2) gust = 1;
      else if (s < 5) gust = 1 - easeInOut((s - 2.2) / 2.8);
      else { gust = 0; gustT0 = -1; }
    }
    // the rime on the glass builds with the gust and lingers after it
    if (gust > gustFrost) gustFrost += (gust - gustFrost) * Math.min(1, dt * 2.5);
    else gustFrost = Math.max(0, gustFrost - dt / 7);
  }

  function drawSnow(dt, t) {
    if (!flakes.length && !drift.length) return;
    wind += (windTarget - wind) * Math.min(1, dt * 1.5);
    sx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sx.clearRect(0, 0, SW, SH);
    const gv = gust * 340 * gustDir;
    for (const f of flakes) {
      const vx = wind * (0.3 + f.z) + gv * (0.35 + f.z) + Math.cos(t * 0.9 + f.ph) * f.sw * 0.5;
      const vy = f.vy * (1 - 0.4 * gust) + Math.sin(t * 2.3 + f.ph) * 30 * gust;
      f.x += vx * dt;
      f.y += vy * dt;
      if (f.y > SH + 10) Object.assign(f, newFlake(false));
      if (f.x < -20) f.x += SW + 40;
      else if (f.x > SW + 20) f.x -= SW + 40;
      const d = f.r * 2.6;
      const sp = Math.hypot(vx, vy);
      sx.globalAlpha = f.a;
      if (sp > 100) {
        // fast flakes smear along their path
        const st = 1 + Math.min(2.2, (sp - 100) / 110);
        const c = vx / sp, s = vy / sp;
        sx.setTransform(c * st * DPR, s * st * DPR, -s * DPR, c * DPR, f.x * DPR, f.y * DPR);
        sx.drawImage(flakeSprite, -d / 2, -d / 2, d, d);
        sx.setTransform(DPR, 0, 0, DPR, 0, 0);
      } else {
        sx.drawImage(flakeSprite, f.x - d / 2, f.y - d / 2, d, d);
      }
    }
    // powder blown off the snow on the window head and sill
    if (gust > 0.25 && ledges.length) {
      const n = gust * 70 * dt;
      let k = n | 0;
      if (Math.random() < n - k) k++;
      for (; k > 0 && drift.length < 350; k--) {
        const L = ledges[(Math.random() * ledges.length) | 0];
        drift.push({
          x: L.x + Math.random() * L.w, y: L.y + Math.random() * 4,
          vx: gustDir * (60 + Math.random() * 140) * gust, vy: -(15 + Math.random() * 45),
          age: 0, life: 1.4 + Math.random() * 1.8, r: 0.5 + Math.random() * 1.3,
          a: 0.25 + Math.random() * 0.4, ph: Math.random() * 6.28
        });
      }
    }
    for (let i = drift.length - 1; i >= 0; i--) {
      const p = drift[i];
      p.age += dt;
      if (p.age >= p.life) { drift.splice(i, 1); continue; }
      p.vx += gustDir * gust * 160 * dt;
      p.vy += (12 - p.vy * 0.6) * dt + Math.sin(t * 4 + p.ph) * 40 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const d = p.r * 3;
      sx.globalAlpha = p.a * (1 - p.age / p.life) * Math.min(1, p.age * 8);
      sx.drawImage(flakeSprite, p.x - d / 2, p.y - d / 2, d, d);
    }
    sx.globalAlpha = 1;
  }
  window.addEventListener('pointermove', (e) => {
    windTarget = (e.clientX / (SW || 1) - 0.5) * 60;
  }, { passive: true });

  /* ---------- Time ---------- */
  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const fmtDate = (d) => `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const plural = (n, one, many) => (n === 1 ? one : many);

  function getState() {
    const now = new Date();
    const y = now.getFullYear();
    const isXmas = now.getMonth() === 11 && now.getDate() === 25;
    let target = new Date(y, 11, 25);
    if (now >= new Date(y, 11, 26)) target = new Date(y + 1, 11, 25);
    const s = Math.max(0, Math.floor((target - now) / 1000));
    const sleeps = Math.round((Date.UTC(target.getFullYear(), 11, 25) - Date.UTC(y, now.getMonth(), now.getDate())) / 86400000);
    return {
      now, isXmas, target, sleeps,
      d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), sec: s % 60
    };
  }

  function updateText(st) {
    const sr = st.isXmas
      ? "It's Christmas Day."
      : `${st.d} ${plural(st.d, 'day', 'days')}, ${st.h} ${plural(st.h, 'hour', 'hours')} and ${st.m} ${plural(st.m, 'minute', 'minutes')} until Christmas Day.`;
    if (timerEl.textContent !== sr) timerEl.textContent = sr;
  }

  function update(nowPerf, force) {
    const st = getState();
    const sec = Math.ceil(st.now.getTime() / 1000);   // the countdown changes exactly when this does
    if (!force && sec === lastSecond) return;
    lastSecond = sec;

    const newMode = preview || st.isXmas ? 'xmas' : 'count';
    const modeChanged = newMode !== mode;
    mode = newMode;

    if (mode === 'count') {
      const digits = Math.max(2, String(st.d).length);
      if (digits !== dayDigits) { dayDigits = digits; layoutText(); repaintAllNow(); }
    }

    const contents = mode === 'count'
      ? [
          { type: 'count', num: String(st.d), label: plural(st.d, 'day', 'days') },
          { type: 'count', num: pad(st.h), label: plural(st.h, 'hour', 'hours') },
          { type: 'count', num: pad(st.m), label: plural(st.m, 'minute', 'minutes') },
          { type: 'count', num: pad(st.sec), label: plural(st.sec, 'second', 'seconds') }
        ]
      : [{ type: 'none' }, { type: 'none' }, { type: 'none' }, { type: 'none' }];

    contents.forEach((c, i) => {
      c.id = c.type === 'count' ? `count:${c.num}:${c.label}` : 'none';
      const u = units[i];
      if (modeChanged || force) setContent(u, c, nowPerf + i * WRITE.stagger, WRITE);
      else if (u.id !== c.id) setContent(u, c, nowPerf, TICK);
    });

    if (modeChanged && mode === 'count') scheduleIntroDrips(nowPerf);
    updateText(st);
  }

  // No visible controls: add #christmas-day to the page address to preview Christmas Day.
  function readPreviewHash() {
    const want = location.hash === '#christmas-day';
    if (want === preview) return;
    preview = want;
    strokes.length = 0;
    curStroke = null;
    pending.length = 0;
    if (bootDone) update(performance.now(), true);
  }
  preview = location.hash === '#christmas-day';
  window.addEventListener('hashchange', readPreviewHash);

  /* ---------- Layout ---------- */
  function resize() {
    const r = glassEl.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    W = r.width;
    H = r.height;
    glassEl.width = Math.round(W * DPR);
    glassEl.height = Math.round(H * DPR);
    frostLayer.width = frostTex.width = regrow.width = glassEl.width;
    frostLayer.height = frostTex.height = regrow.height = glassEl.height;
    interior.width = Math.max(4, Math.round(W));
    interior.height = Math.max(4, Math.round(H));
    blurA.width = Math.max(2, Math.round(W / 8));
    blurA.height = Math.max(2, Math.round(H / 8));
    blurB.width = Math.max(2, Math.round(W / 24));
    blurB.height = Math.max(2, Math.round(H / 24));

    const m = mullionEl.getBoundingClientRect().width || 10;
    const pw = (W - m) / 2, ph = (H - m) / 2;
    panes = [
      { x: 0, y: 0, w: pw, h: ph },
      { x: pw + m, y: 0, w: pw, h: ph },
      { x: 0, y: ph + m, w: pw, h: ph },
      { x: pw + m, y: ph + m, w: pw, h: ph }
    ];
    strokes.length = 0;
    curStroke = null;
    drips.length = 0;
    pending.length = 0;
    buildRoom();
    buildFrost();
    layoutText();
    repaintAllNow();
  }

  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    const t = now / 1000;
    if (bootDone) update(now, false);
    stepMelt(dt);
    focus = easeInOut(clamp01((melt - 0.15) / 0.85));
    updateGust(now, dt);
    if (W > 0) {
      processPending(now);
      maybeSpawnTextDrips(now, dt);
      maybeSpawnMeltDrips(dt);
      updateDrips(now, dt);
      composeGlass(now, t);
    }
    drawSnow(dt, t);
    requestAnimationFrame(loop);
  }

  function fontsGo() {
    if (bootDone) return;
    bootDone = true;
    renderedWithHand = !document.fonts || document.fonts.check('700 40px "Caveat"');
    layoutText();
    update(performance.now() + 150, true);
  }

  mq.addEventListener && mq.addEventListener('change', (e) => {
    reduce = e.matches;
    if (reduce) { drips.length = 0; pending.length = 0; }
    initSnow();
  });
  if ('ResizeObserver' in window) new ResizeObserver(() => resize()).observe(glassEl);
  else window.addEventListener('resize', resize);
  window.addEventListener('resize', sizeSnow);

  sizeSnow();
  resize();
  updateText(getState());
  requestAnimationFrame(loop);

  if (document.fonts && document.fonts.load) {
    const tryLoad = () => document.fonts.load('700 100px "Caveat"').then(fontsGo, fontsGo);
    if (document.readyState === 'complete') tryLoad();
    else window.addEventListener('load', tryLoad);
    setTimeout(fontsGo, 2200);
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => {
      if (W > 0) buildRoom();   // the Christmas banner uses the body font
      if (bootDone && !renderedWithHand && document.fonts.check('700 40px "Caveat"')) {
        renderedWithHand = true;
        layoutText();
        repaintAllNow();
      }
    });
  } else {
    fontsGo();
  }
})();
</script>
</body>
</html>
